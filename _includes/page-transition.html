<div class="page-transition" aria-hidden="true">
  <img src="{{ '/assets/img/fly-swan.png' | relative_url }}" alt="" draggable="false">
</div>
<script>
  (() => {
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let navigating = false;
    let transitionTimer = null;
    let safetyTimer = null;
    let audioContext = null;

    function getAudioContext() {
      try {
        const AudioContextConstructor = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextConstructor) {
          return null;
        }
        if (!audioContext || audioContext.state === 'closed') {
          audioContext = new AudioContextConstructor();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(() => {});
        }
        return audioContext;
      } catch (err) {
        return null;
      }
    }

    // Unlock audio on first user touch/pointer interaction so it's ready when clicked
    const unlockAudio = () => {
      const ctx = getAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    };
    window.addEventListener('pointerdown', unlockAudio, { passive: true, once: true });
    window.addEventListener('touchstart', unlockAudio, { passive: true, once: true });

    function playTransitionSound() {
      try {
        const context = getAudioContext();
        if (!context) {
          return;
        }

        const resumePromise = context.state === 'suspended' ? context.resume() : Promise.resolve();
        resumePromise.then(() => {
          const start = context.currentTime + 0.02;
          const duration = 1.3;

          // 1. Air / wing whoosh (filtered white noise)
          const bufferSize = Math.floor(context.sampleRate * duration);
          const noiseBuffer = context.createBuffer(1, bufferSize, context.sampleRate);
          const noise = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            noise[i] = Math.random() * 2 - 1;
          }

          const noiseSource = context.createBufferSource();
          noiseSource.buffer = noiseBuffer;

          const filter = context.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(400, start);
          filter.frequency.exponentialRampToValueAtTime(2200, start + 0.65);
          filter.frequency.exponentialRampToValueAtTime(300, start + duration);

          const noiseVolume = context.createGain();
          noiseVolume.gain.setValueAtTime(0.0001, start);
          noiseVolume.gain.exponentialRampToValueAtTime(0.18, start + 0.35);
          noiseVolume.gain.exponentialRampToValueAtTime(0.0001, start + duration);

          noiseSource.connect(filter).connect(noiseVolume).connect(context.destination);
          noiseSource.start(start);
          noiseSource.stop(start + duration);

          // 2. Gentle resonant tone (audible on phones & laptops: 320Hz to 160Hz)
          const tone = context.createOscillator();
          const toneVolume = context.createGain();
          tone.type = 'sine';
          tone.frequency.setValueAtTime(320, start);
          tone.frequency.exponentialRampToValueAtTime(160, start + 1.1);

          toneVolume.gain.setValueAtTime(0.0001, start);
          toneVolume.gain.exponentialRampToValueAtTime(0.08, start + 0.2);
          toneVolume.gain.exponentialRampToValueAtTime(0.0001, start + 1.1);

          tone.connect(toneVolume).connect(context.destination);
          tone.start(start);
          tone.stop(start + 1.1);
        }).catch(() => {});
      } catch (e) {
        // Audio error should never prevent navigation
      }
    }

    function resetTransition() {
      navigating = false;
      document.body.classList.remove('page-transitioning');
      if (transitionTimer) {
        clearTimeout(transitionTimer);
        transitionTimer = null;
      }
      if (safetyTimer) {
        clearTimeout(safetyTimer);
        safetyTimer = null;
      }
    }

    // Reset when navigating back via browser history or restored from bfcache
    window.addEventListener('pageshow', (event) => {
      resetTransition();
    });

    window.addEventListener('popstate', () => {
      resetTransition();
    });

    window.addEventListener('pagehide', () => {
      resetTransition();
    });

    // Make sure initial state is clean
    resetTransition();

    document.addEventListener('click', (event) => {
      if (navigating || reducedMotion.matches || event.defaultPrevented || event.button !== 0 ||
          event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
        return;
      }

      const link = event.target.closest('a');
      if (!link || link.hasAttribute('download') || (link.target && link.target !== '_self')) {
        return;
      }

      const rawHref = link.getAttribute('href');
      if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('javascript:') || rawHref.startsWith('mailto:') || rawHref.startsWith('tel:')) {
        return;
      }

      const destination = new URL(link.href, window.location.href);
      if (!['http:', 'https:'].includes(destination.protocol) ||
          destination.origin !== window.location.origin ||
          (destination.pathname === window.location.pathname &&
            destination.search === window.location.search)) {
        return;
      }

      event.preventDefault();
      navigating = true;

      // Start sound immediately within the user click gesture
      playTransitionSound();

      document.body.classList.add('page-transitioning');

      transitionTimer = window.setTimeout(() => {
        window.location.assign(destination.href);
      }, 1500);

      // Safety timeout: if page doesn't unload within 4 seconds, reset to avoid stuck screen
      safetyTimer = window.setTimeout(() => {
        resetTransition();
      }, 4000);
    });
  })();
</script>
