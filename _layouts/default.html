<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/thewittyswan.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/thewittyswan.png' | relative_url }}" alt="thewittyswan">
      <span>thewittyswan</span>
    </a>
    <nav>
      <a href="{{ '/home/' | relative_url }}" class="{% if page.url contains '/home/' %}active{% endif %}">home</a>
      <a href="{{ '/netsec/' | relative_url }}" class="{% if page.url contains '/netsec/' %}active{% endif %}">netsec</a>
      <a href="{{ '/projects/' | relative_url }}" class="{% if page.url contains '/projects/' %}active{% endif %}">projects</a>
      <a href="{{ '/literature/' | relative_url }}" class="{% if page.url contains '/literature/' %}active{% endif %}">literature</a>
      <a href="{{ '/glossary/' | relative_url }}" class="{% if page.url contains '/glossary/' %}active{% endif %}">glossary</a>
      <a href="{{ '/recommends/' | relative_url }}" class="{% if page.url contains '/recommends/' %}active{% endif %}">recommends</a>
      <a href="{{ '/now/' | relative_url }}" class="{% if page.url contains '/now/' %}active{% endif %}">now</a>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="footer-links">
      <a href="https://github.com/dhawalshankar" target="_blank" rel="noopener">github</a>
      <a href="https://linkedin.com/in/dhawalshukl" target="_blank" rel="noopener">linkedin</a>
      <a href="https://leetcode.com/u/dhawalshankar" target="_blank" rel="noopener">leetcode</a>
      <a href="mailto:dhawalmannu@gmail.com">email</a>
      <a href="https://drive.google.com/file/d/1zodZ1AqMNmWbzGSzmJerYLQGAHMEUwTa/view?usp=sharing" target="_blank"
        rel="noopener">resume</a>
    </div>
    <p>&copy; {{ site.time | date: "%Y" }} thewittyswan</p>
    <p class="footer-signature">
      <a href="https://drive.google.com/file/d/1zodZ1AqMNmWbzGSzmJerYLQGAHMEUwTa/view?usp=sharing" target="_blank"
        rel="noopener">Dhawal Shukla</a>
      <span class="footer-title">Backend Software Engineer</span>
    </p>
  </footer>
  {% include page-transition.html %}
</body>

</html>
