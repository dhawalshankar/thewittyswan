name: Monthly Portfolio Sync

on:
  schedule:
    # Runs at 00:00 UTC on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run resume sync
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRIVE_FILE_ID: '1zodZ1AqMNmWbzGSzmJerYLQGAHMEUwTa'
        run: |
          python scripts/sync_resume.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio.json projects/index.md .resume_hash
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(auto): monthly resume sync from drive [skip ci]"
            git push origin main
          fi
